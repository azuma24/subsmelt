name: Build and Publish Docker Image

# Auto-publishes on a version tag push (v*), and can still be run manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Never publish an image that has not passed the test gate.
  test:
    uses: ./.github/workflows/ci.yml

  # Each architecture builds natively on its own runner and pushes by digest;
  # the merge job then publishes one multi-arch manifest under the release tags
  # (Docker's "distribute build across multiple runners" pattern). arm64 used
  # to build under QEMU on amd64, where the ffmpeg stage alone took ~13 min.
  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          # Use a package-scoped token when configured because GHCR packages
          # created outside Actions may not grant this repo's GITHUB_TOKEN
          # package-level write access, even with `packages: write`.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Labels only; the tags are applied to the merged manifest below.
      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      # The test gate above already built this exact image on this ref and
      # wrote it to CI's per-arch cache scope, so this build is almost entirely
      # cache hits; it only reads, so the two workflows never overwrite each
      # other's cache manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ci-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish-manifest
      queue: max
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout for release tag lookup
        if: github.ref_type == 'tag'
        uses: actions/checkout@v6.0.3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Extract metadata (version or commit tag)
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,enable=${{ github.ref_type == 'branch' }}

      - name: Create and push the multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          tag=$(jq -er '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tags=(-t "$tag")

          # Check the live release order while holding the publish lock. The
          # minor alias follows its highest stable patch. latest follows the
          # highest stable version across all minor lines.
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version=${GITHUB_REF_NAME#v}
            minor=${version%.*}
            stable_tags=$(git ls-remote --refs --tags --sort=-version:refname origin 'refs/tags/v*' |
              awk '$2 ~ /^refs\/tags\/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ {
                sub("^refs/tags/v", "", $2)
                print $2
              }')
            newest_patch=$(awk -v prefix="$minor." 'index($0, prefix) == 1 {print; exit}' <<< "$stable_tags")
            if [[ $version == "$newest_patch" ]]; then
              tags+=(-t "$IMAGE:$minor")
            fi
            if [[ $version == "${stable_tags%%$'\n'*}" ]]; then
              tags+=(-t "$IMAGE:latest")
            fi
          fi

          shopt -s nullglob
          digests=("$DIGESTS_DIR"/*)
          test "${#digests[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE@sha256:${digests[0]##*/}" "$IMAGE@sha256:${digests[1]##*/}"

      - name: Inspect image
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
